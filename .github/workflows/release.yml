name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LEPTA.sln

      - name: Test
        run: dotnet test LEPTA.Tests --filter "Category!=Integration"

      - name: Derive version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"          # strip optional leading "v"
          BASE="${TAG%%-*}"                    # drop any prerelease, e.g. 0.2.0-rc1 -> 0.2.0
          DOTS=$(awk -F. '{print NF-1}' <<< "$BASE")
          ASM="$BASE"
          for _ in $(seq $DOTS 2); do ASM="$ASM.0"; done   # pad to 4-part for Assembly/FileVersion
          echo "version=$TAG"     >> "$GITHUB_OUTPUT"
          echo "assembly=$ASM"    >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish LEPTA\LEPTA.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.assembly }}
          -p:FileVersion=${{ steps.ver.outputs.assembly }}
          -o publish

      - name: Zip artifact
        run: Compress-Archive -Path publish\* -DestinationPath LEPTA-win-x64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: LEPTA-win-x64.zip
          generate_release_notes: true

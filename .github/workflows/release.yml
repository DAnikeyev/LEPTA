name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LEPTA.sln

      - name: Test
        run: dotnet test LEPTA.Tests --filter "Category!=Integration"

      - name: Publish
        run: >
          dotnet publish LEPTA\LEPTA.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip artifact
        run: Compress-Archive -Path publish\* -DestinationPath LEPTA-win-x64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: LEPTA-win-x64.zip
          generate_release_notes: true
